<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amal Cherian Jacob | Embedded Systems Engineer</title>
    <style>
        :root {
            --bg-main: #0A1A2F;
            --bg-dark: #091423;
            --card-bg: #11263F;
            --accent: #00E0FF;
            --text-main: #FFFFFF;
            --text-muted: #D0D8E0;
        }

        * {
            box-sizing: border-box;
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
        }

        /* Header + Navbar */
        header {
            background-color: var(--bg-main);
            padding: 20px 40px;
            border-bottom: 2px solid var(--accent);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .header-inner {
            max-width: 1100px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand {
            display: flex;
            flex-direction: column;
        }

        .brand h1 {
            font-size: 26px;
            margin: 0;
            color: var(--accent);
        }

        .brand p {
            margin: 4px 0 0;
            font-size: 13px;
            color: var(--text-muted);
        }

        nav {
            display: flex;
            gap: 18px;
        }

        nav a {
            color: var(--accent);
            text-decoration: none;
            font-size: 14px;
            position: relative;
            padding-bottom: 2px;
        }

        nav a::after {
            content: "";
            position: absolute;
            left: 0;
            bottom: 0;
            width: 0;
            height: 2px;
            background-color: var(--accent);
            transition: width 0.2s ease-in-out;
        }

        nav a:hover::after {
            width: 100%;
        }

        /* Sections */
        section {
            padding: 40px 20px;
        }

        .section-inner {
            max-width: 900px;
            margin: 0 auto;
        }

        h2 {
            color: var(--accent);
            border-left: 5px solid var(--accent);
            padding-left: 10px;
            margin-bottom: 20px;
            font-size: 22px;
        }

        .card {
            background-color: var(--card-bg);
            padding: 20px;
            margin: 16px 0;
            border-left: 4px solid var(--accent);
            border-radius: 6px;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }

        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.35);
        }

        .card h3 {
            margin-top: 0;
            margin-bottom: 8px;
            font-size: 18px;
            color: var(--accent);
        }

        .card p {
            margin: 6px 0;
            font-size: 14px;
            color: var(--text-muted);
        }

        .contact a {
            color: var(--accent);
            text-decoration: none;
        }

        .contact a:hover {
            text-decoration: underline;
        }

        footer {
            text-align: center;
            padding: 20px;
            background-color: var(--bg-dark);
            color: var(--text-muted);
            border-top: 2px solid var(--accent);
            font-size: 13px;
        }

        /* View More Button + Expandable Sections */
        .view-more-btn {
            background-color: transparent;
            border: 1px solid var(--accent);
            color: var(--accent);
            padding: 6px 12px;
            font-size: 13px;
            cursor: pointer;
            border-radius: 4px;
            margin-top: 10px;
            transition: background-color 0.2s ease;
        }

        .view-more-btn:hover {
            background-color: var(--accent);
            color: var(--bg-main);
        }

        .hidden-section {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.35s ease;
            margin-top: 10px;
        }

        .hidden-section.open {
            max-height: 600px;
        }

        /* Responsive */
        @media (max-width: 768px) {
            header {
                padding: 12px 16px;
            }

            .header-inner {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }

            .brand h1 {
                font-size: 22px;
            }

            .brand p {
                font-size: 12px;
            }

            nav {
                flex-wrap: wrap;
                gap: 10px;
            }

            nav a {
                font-size: 13px;
            }

            section {
                padding: 28px 16px;
            }

            h2 {
                font-size: 20px;
            }

            .card {
                padding: 16px;
            }

            .card h3 {
                font-size: 16px;
            }

            .card p {
